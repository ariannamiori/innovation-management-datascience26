# Team 27 · Utility-scale energy storage · client Enel
# One place for every design choice of the pipeline (kickoff: "config, not hard-coding").
# Each value is justified in docs/ (Step 3: docs/03_present_score.md).

sector: Utility-scale energy storage   # labels only
client: Enel
team: 27

patstat:
  env: PROD            # PATSTAT database on TIP: TEST is small and fast (to develop), PROD is complete (final numbers)
  chunk: 5000          # ids per IN (...) query: keeps every query small enough for TIP

families_csv: data/families.csv   # Step 0 output, read by every later step; one required column: docdb_family_id

years:                       # (not used yet: Step 1)
  first: 2000                # first priority year described
  last_complete: 2023        # later priority years are truncated by the 18-month publication lag: flag, not a decline

description:                 # (not used yet: Step 1)
  growth_window: [2010, 2023]  # priority years over which growth is measured
  top_cpc: 10                  # number of CPC subclasses in the top table

competition:                 # Step 2 (shortlist rule, also used by Step 3 while there is no shortlist)
  concentration_window: 3    # (not used yet) years per rolling window for HHI / CR4
  entrant_split_year: 2018   # (not used yet) first sector family from this year on = entrant
  n_firms_to_score: 15       # how many firms are scored: enough to fill the quadrant
  min_families: 5            # a firm needs at least this many families in the window to be scored (10 left only 6 firms)

present_score:               # Step 3 · src/03_present_score.py · every choice explained in docs/03_present_score.md
  firms_csv: outputs/tables/firms_to_score.csv   # Step 2 shortlist; while it does not exist: the largest portfolios
  output_csv: outputs/tables/present_scores.csv  # the scores; present_scores_robustness.csv is written next to it
  window: [2010, 2019]       # priority years scored: old enough to be decided and cited (2018 covered only 13 % of families)
  last_citation_year: 2025   # last complete year of citations in the PATSTAT edition
  citation_window: 5         # forward citations counted within N years of first publication (Hall, Jaffe & Trajtenberg)
  min_cohort: 5              # priority-year x CPC-subclass cohorts smaller than this are normalised by the year mean
  keep_ipr: [PI]             # patents of invention only: no utility models (frequent in CN), no designs
  ep_only: false             # true = only families with an EP application (tutorial 4); false: 86 % of families are CN-only
  success_offices: null      # offices whose decisions count for Success; null = all national offices (EP covered 5 %)
  log_volume: true           # volume enters as log(families): the largest firm cannot decide the ranking alone
  weights: {volume: 0.25, influence: 0.25, success: 0.25, globalization: 0.25}   # equal: no indicator preferred a priori
  method: mean               # mean: each indicator / its mean, 100 = average firm · rrf: reciprocal rank fusion

future_score:                # (not used yet: Step 4)
  publication_years: [2025, 2026]   # "the last 1-2 years of published applications"
  backtest_freeze_year: 2015        # compute the score with data up to T only...
  backtest_outcome_years: 5         # ...and compare with what happened in the next N years

quadrant:                    # (not used yet: Step 5)
  split: median              # where the axes are cut: median of the scored firms (or 100 = average)

recommendation:              # (not used yet: Step 6)
  firm: null                 # the firm picked from the quadrant
